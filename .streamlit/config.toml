[theme]
base = "dark"
primaryColor = "#4fd1a5"
backgroundColor = "#0b0c0e"
secondaryBackgroundColor = "#0f1013"
textColor = "#e8e9ec"
font = "sans serif"

[server]
headless = true
# Serves ./static/ at /app/static/. The TradingView Charting Library lives
# there, so the chart component can load it from the same origin as the app —
# no second port, which also keeps it working on a hosted single-port deploy.
enableStaticServing = true
